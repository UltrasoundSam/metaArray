[project]
name = "metaarray"
version = "2.0.2"
description = "Meta-info container for numpy ndarray, with associate libraries"
authors = [
    { name = "Sam Hill", email = "s.hill@yorksj.ac.uk" },
    { name = "Charley (Yichao) Fan" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-2.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib>=3.4",
    "h5py>=3.4",
    "pyserial>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=2.12",
    "tox>=3.24",
    "flake8>=5.0",
    "flake8-pyproject>=1.2",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/metaArray"]

[tool.hatch.build.targets.wheel]
include = ["src/metaArray"]

[tool.hatch.build.targets.wheel.sources]
"src/metaArray" = "metaArray"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]

[tool.flake8]
per-file-ignores = [
    'src/metaArray/__init__.py:F401',
    'src/metaArray/drv_hp4294.py:E221',
]
